[project]
name = "text2sqlchatbotservice"
version = "0.1.0"
description = "Text-to-SQL chat agent over Snowflake US Open Census dataset"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.8",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
    "snowflake-connector-python>=3.13",
    "sqlglot>=25.0",
    "boto3>=1.35",
    "strands-agents>=0.5",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
metricflow = [
    "metricflow",
    "dbt-semantic-interfaces",
]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[project.scripts]
text2sqlchatbotservice = "text2sqlchatbotservice.app:run"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
